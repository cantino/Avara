services:
  avara:
    build:
      context: .
      dockerfile: platform/web/Dockerfile
      target: serve
      args:
        # Level set packaged into the build; see platform/web/README.md.
        AVARA_WEB_LEVELSET: ${AVARA_WEB_LEVELSET:-aa-normal}
    image: avara-web
    ports:
      - "${AVARA_WEB_PORT:-8099}:80"
    depends_on:
      - gateway

  # Relays datagrams between browser clients. nginx proxies /net to it, so
  # only the one port above needs publishing.
  gateway:
    build:
      context: .
      dockerfile: platform/web/Dockerfile
      target: gateway
    image: avara-gw
    environment:
      AVARA_GW_VERBOSE: ${AVARA_GW_VERBOSE:-}
