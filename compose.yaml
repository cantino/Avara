services:
  avara:
    build:
      context: .
      dockerfile: platform/web/Dockerfile
      target: serve
      args:
        # Level sets packaged into the build; see platform/web/README.md.
        AVARA_WEB_LEVELSETS: ${AVARA_WEB_LEVELSETS:-aa-normal aa-abnormal aa-deux-normal aa-deux-abnormal aa-tre single-player}
    image: avara-web
    ports:
      - "${AVARA_WEB_PORT:-8099}:80"
    depends_on:
      - gateway

  # Relays datagrams between browser clients. nginx proxies /net to it, so
  # only the one port above needs publishing.
  gateway:
    build:
      context: .
      dockerfile: platform/web/Dockerfile
      target: gateway
    image: avara-gw
    # Published so another machine's page can be pointed at this gateway with
    # ?gateway=ws://host:8088/net. Not needed when the page is served from the
    # nginx above, which proxies /net to it over the compose network.
    ports:
      - "${AVARA_GW_PORT:-8088}:8088"
    environment:
      AVARA_GW_VERBOSE: ${AVARA_GW_VERBOSE:-}
