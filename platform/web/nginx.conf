server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index avara.html;

    # nginx already maps .wasm to application/wasm; be explicit so older base
    # images do not fall back to octet-stream and break streaming compilation.
    types { application/wasm wasm; }
    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/wasm application/javascript application/octet-stream text/html;
    gzip_min_length 1024;

    # The artifact names are not content-hashed, so a rebuild has to be visible
    # on reload rather than served from cache.
    add_header Cache-Control "no-cache";

    # Never rewrite a request to an absolute URL: nginx would rebuild it from
    # server_name and the *container's* port 80, losing the published port.
    absolute_redirect off;

    # The client's datagram tunnel. Same origin as the page, so there is no
    # cross-origin or mixed-content problem and one port is all that is
    # published.
    location /net {
        proxy_pass http://gateway:8088/net;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
